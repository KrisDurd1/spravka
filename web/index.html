<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Протокол личного распада</title>
<meta name="description" content="Четыре голоса, которые не советуют и не утешают. Телеграм-бот и личный журнал наблюдений." />
<meta name="theme-color" content="#0B0D0F" />
<link rel="icon" href="%BASE_URL%favicon.ico?v=3" sizes="any" />
<link rel="icon" href="%BASE_URL%favicon-32.png?v=3" type="image/png" sizes="32x32" />
<link rel="icon" href="%BASE_URL%favicon.svg?v=3" type="image/svg+xml" />
<link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png?v=3" sizes="180x180" />
<link rel="mask-icon" href="%BASE_URL%favicon-mono.svg" color="#8E3A34" />
<meta property="og:title" content="Ответ у тебя уже есть. Не хватает вопроса." />
<meta property="og:description" content="Четыре голоса, которые не советуют и не утешают." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <a class="mark" href="#s1">
      <span class="mark-dot" aria-hidden="true"></span>
      <span class="mark-txt">ПЛР</span>
    </a>

    <span class="feed" aria-hidden="true">
      <span class="feed-line" id="feed"></span>
    </span>

    <nav class="langs" id="langs" aria-label="Язык"></nav>

    <span class="status">
      <span class="lamp" aria-hidden="true"><i></i></span>
      <span class="status-txt"><span class="roll" id="roll">01</span>&nbsp;/&nbsp;04</span>
    </span>
  </div>
  <span class="bar-scan" aria-hidden="true"></span>
</header>

<nav class="dots" id="dots" aria-label="Разделы"></nav>

<main>
  <section class="hero snap" id="s1" data-label="начало">
    <canvas class="field" id="hero-sky" aria-hidden="true"></canvas>
    <div class="wrap hero-inner">
      <h1 class="lift" data-reveal>
        <span class="ln" data-t="heroA"></span>
        <span class="ln" data-t="heroB"></span>
        <span class="ln muted" data-t="heroC"></span>
      </h1>
      <p class="lede" data-reveal><span data-t="lede"></span></p>
      <p class="act" data-reveal>
        <a class="cta flip" href="https://t.me/spravka_o_raspade_bot">
          <span class="face"><span data-t="cta"></span></span>
          <span class="face back"><span data-t="ctaBack"></span></span>
        </a>
        <a class="cta ghost" href="https://github.com/KrisDurd1/personal-degradation-protocol" data-t="code"></a>
      </p>
    </div>
    <div class="ripple" id="ripple" aria-hidden="true"></div>
    <button class="next" type="button" data-next="s2" data-t="scroll"></button>
  </section>

  <section class="wrap block snap" id="s2" data-label="что это">
    <p class="eyebrow"><i class="tick" aria-hidden="true"></i><span data-t="aboutLabel"></span></p>
    <h2 data-reveal data-t-html="aboutH"></h2>
    <p class="lede" data-reveal data-t="aboutLede"></p>
    <ol class="rules" id="rules" data-reveal></ol>
  </section>

  <section class="wrap block snap block--long" id="s3" data-label="журнал">
    <p class="eyebrow"><i class="tick" aria-hidden="true"></i><span data-t="journalLabel"></span></p>
    <h2 class="h3" data-reveal data-t="journalH"></h2>
    <p class="lede" data-reveal data-t="journalLede"></p>
    <dl class="cmds" id="cmds" data-reveal></dl>
    <p class="note" data-t="journalNote"></p>
  </section>

  <section class="wrap block snap block--long" id="s4" data-label="перехвачено">
    <p class="eyebrow"><i class="tick" aria-hidden="true"></i><span data-t="interceptLabel"></span></p>
    <ul class="intercepts" id="intercepts" data-reveal></ul>
  </section>

  <section class="wrap block snap" id="s5" data-label="голоса">
    <p class="eyebrow"><i class="tick" aria-hidden="true"></i><span data-t="voicesLabel"></span></p>
    <h2 class="h3" data-reveal data-t="voicesH"></h2>
    <p class="lede" data-reveal><span data-t="voicesLede"></span></p>

    <div class="sky" id="sky" data-reveal>
      <canvas class="field" id="voice-sky" aria-hidden="true"></canvas>
      <div class="stars" id="stars" role="group" aria-label="Четыре голоса"></div>
      <div class="crosshair" id="crosshair" aria-hidden="true"></div>
    </div>

    <article class="card" aria-live="polite" data-reveal>
        <span class="corners" aria-hidden="true"></span>
      <p class="card-top"><span class="code" id="v-code"></span><span class="mag" id="v-mag"></span></p>
      <h3 id="v-name"></h3>
      <p class="about" id="v-about"></p>
      <ul class="tags" id="v-tags"></ul>
      <p class="sample" id="v-sample"></p>
      <p class="fine"><span data-t="inChat"></span> <code id="v-cmd"></code></p>
    </article>
  </section>

  <footer class="wrap foot">
    <p><a href="https://github.com/KrisDurd1/personal-degradation-protocol" data-t="footLink"></a></p>
    <p class="note" data-t="footNote"></p>
  </footer>
</main>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
